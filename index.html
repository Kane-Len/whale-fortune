<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 운세 🐳</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #e0f4ff 0%, #f0e8ff 50%, #fff5e8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      animation: cardIn 0.6s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .top-label {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #7bbfd4;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 8px 40px rgba(103,180,228,0.18), 0 2px 8px rgba(0,0,0,0.06);
      border: 1.5px solid rgba(255,255,255,0.9);
      text-align: center;
    }

    /* 고래 애니메이션 */
    .whale {
      font-size: 80px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1));
      margin-bottom: 4px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-14px) rotate(3deg); }
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg) scale(1.1); }
      40% { transform: rotate(10deg) scale(1.12); }
      60% { transform: rotate(-7deg) scale(1.08); }
      80% { transform: rotate(7deg) scale(1.05); }
    }

    .whale.shaking { animation: shake 0.35s ease-in-out infinite; }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #2d6f8f;
      margin: 8px 0;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 14px;
      color: #8bafc0;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn:active { transform: scale(0.97); }

    .btn-main {
      background: linear-gradient(135deg, #67C9E4, #4ab8d4);
      color: white;
      font-size: 16px;
      padding: 14px 40px;
      border-radius: 50px;
      animation: pulse 2.5s ease-in-out infinite;
      letter-spacing: 0.5px;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(103,201,228,0.3); }
      50% { box-shadow: 0 8px 30px rgba(103,201,228,0.55); transform: scale(1.03); }
    }

    .btn-reset {
      background: rgba(103,201,228,0.12);
      color: #4a9ab8;
      font-size: 14px;
      padding: 12px;
      border-radius: 14px;
      width: 100%;
      margin-top: 4px;
    }

    /* 운세 결과 */
    .fortune-box {
      background: linear-gradient(135deg, #67C9E418, #67C9E408);
      border: 1.5px solid #67C9E433;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .fortune-emoji { font-size: 28px; margin-bottom: 8px; }

    .fortune-message {
      font-size: 15px;
      color: #2d4a5a;
      line-height: 1.75;
      font-weight: 500;
    }

    .stars {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin: 14px 0 4px;
    }

    .star { font-size: 20px; transition: all 0.3s ease; }
    .star.off { filter: grayscale(1) opacity(0.3); }

    .tip-box {
      background: #67C9E415;
      border-radius: 12px;
      padding: 10px 16px;
      margin: 14px 0 18px;
      font-size: 12px;
      color: #3aa8c8;
      font-weight: 700;
    }

    /* 이미 봤을 때 배너 */
    .already-banner {
      background: linear-gradient(135deg, #fff3cd, #ffeaa0);
      border: 1.5px solid #ffd96688;
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 13px;
      color: #a07800;
      font-weight: 600;
    }

    .loading-text {
      font-size: 15px;
      color: #7bbfd4;
      font-weight: 600;
      margin-top: 16px;
    }

    .footer {
      text-align: center;
      margin-top: 14px;
      font-size: 11px;
      color: #a0bfcc;
    }

    .fade-in {
      animation: fadeIn 0.5s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 카드 없을 때 데모 안내 */
    .demo-badge {
      background: #ff9f4320;
      border: 1px solid #ff9f4355;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      color: #cc6600;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-label">🌊 Whale Fortune 🌊</div>

  <div class="card">

    <!-- 로딩 화면 -->
    <div id="screen-loading">
      <div class="whale"><img src="./whale.png" alt="고래" style="width:150px;height:150px;object-fit:contain;" /></div>
      <p class="loading-text">불러오는 중...</p>
    </div>

    <!-- 인트로 화면 -->
    <div id="screen-intro" style="display:none;">
      <div class="whale" id="whale-intro"><img src="./whale.png" alt="고래" style="width:150px;height:150px;object-fit:contain;" /></div>
      <h1>오늘의 운세</h1>
      <p class="subtitle">고래가 오늘의 운세를 가져왔어요!<br/>버튼을 눌러 확인해봐요 🫧</p>
      <div id="demo-notice" style="display:none;">
        <span class="demo-badge">🔧 데모 모드 (카드 없이 보는 중)</span><br/>
      </div>
      <button class="btn btn-main" onclick="revealFortune()">운세 보기 🌊</button>
      <p style="font-size:11px; color:#aac8d6; margin-top:18px;">오늘 날짜 기준으로 운세가 정해져요</p>
    </div>

    <!-- 운세 결과 화면 -->
    <div id="screen-result" style="display:none;" class="fade-in">
      <div class="whale" id="whale-result"><img src="./whale.png" alt="고래" style="width:150px;height:150px;object-fit:contain;" /></div>

      <div class="fortune-box">
        <div class="fortune-emoji" id="result-emoji">🌊</div>
        <p class="fortune-message" id="result-message"></p>
      </div>

      <p style="font-size:12px; color:#9db8c8; font-weight:600; letter-spacing:1px;">오늘의 운세 지수</p>
      <div class="stars" id="result-stars"></div>

      <div class="tip-box" id="result-tip"></div>

      <!-- 이미 본 경우 -->
      <div id="already-notice" style="display:none;" class="already-banner">
        🌙 오늘의 운세는 이미 확인했어요!<br/>
        <span style="font-size:11px; font-weight:400;">자정이 지나면 새로운 운세를 볼 수 있어요.</span>
      </div>

      <button class="btn btn-reset" onclick="goIntro()">처음으로 돌아가기 🌊</button>
    </div>

  </div>

  <div class="footer">고래가 매일 새로운 운세를 가져다줘요 🌊</div>
</div>

<script>
  // ── Supabase 설정 ──────────────────────────────────────────
  const SUPABASE_URL  = 'https://dzlukqowlgfucscfuqwf.supabase.co';
  const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6bHVrcW93bGdmdWNzY2Z1cXdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNzU1MjIsImV4cCI6MjA5NDc1MTUyMn0.y3BFiucnUQKLTUkGMApsrRTjtmaniqvwnp5RcjWvL98';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── 운세 꾸미기 데이터 ─────────────────────────────────────
  const EMOJIS = ['🌊','⭐','🌙','🌈','🫧','🐠','🍀','✨','🌸','🎯'];
  const TIPS   = [
    '오늘의 행운 아이템: 파란색 물건',
    '오늘의 행운 아이템: 따뜻한 음료',
    '오늘의 행운 아이템: 반짝이는 악세서리',
    '오늘의 행운 아이템: 향기로운 것',
    '오늘의 행운 아이템: 손편지 또는 메모',
    '오늘의 행운 아이템: 컬러풀한 간식',
    '오늘의 행운 아이템: 둥근 모양의 물건',
    '오늘의 행운 아이템: 좋아하는 음악',
  ];

  // ── 상태 ───────────────────────────────────────────────────
  let cardId    = null;
  let isDemo    = false;
  let fortuneData = null;
  let alreadyViewed = false;

  // ── 초기화 ─────────────────────────────────────────────────
  window.onload = async () => {
    const params = new URLSearchParams(window.location.search);
    cardId = params.get('card');

    if (!cardId) {
      isDemo = true;
      document.getElementById('demo-notice').style.display = 'block';
      show('intro');
      return;
    }

    const today = new Date().toISOString().split('T')[0];

    // 오늘 이미 본 기록 확인
    const { data: log } = await db
      .from('card_logs')
      .select('fortune_id, fortunes(message)')
      .eq('card_id', cardId)
      .eq('viewed_date', today)
      .maybeSingle();

    if (log) {
      // 이미 봤음 → 결과 화면 (알림 포함)
      fortuneData = { id: log.fortune_id, message: log.fortunes.message };
      alreadyViewed = true;
      renderResult();
      show('result');
    } else {
      show('intro');
    }
  };

  // ── 운세 뽑기 ──────────────────────────────────────────────
  async function revealFortune() {
    document.getElementById('whale-intro').classList.add('shaking');

    if (isDemo) {
      // 데모: DB에서 랜덤
      const { data: all } = await db.from('fortunes').select('*');
      fortuneData = all[Math.floor(Math.random() * all.length)];
    } else {
      const today = new Date().toISOString().split('T')[0];

      // 카드 등록 (없으면 새로 추가)
      await db.from('cards').upsert({ id: cardId }, { onConflict: 'id', ignoreDuplicates: true });

      // 랜덤 운세 가져오기
      const { data: all } = await db.from('fortunes').select('*');
      fortuneData = all[Math.floor(Math.random() * all.length)];

      // 기록 저장
      await db.from('card_logs').insert({
        card_id: cardId,
        fortune_id: fortuneData.id,
        viewed_date: today
      });
    }

    setTimeout(() => {
      document.getElementById('whale-intro').classList.remove('shaking');
      alreadyViewed = false;
      renderResult();
      show('result');
    }, 1000);
  }

  // ── 결과 렌더 ──────────────────────────────────────────────
  function renderResult() {
    if (!fortuneData) return;

    const seed   = fortuneData.id;
    const emoji  = EMOJIS[seed % EMOJIS.length];
    const tip    = TIPS[seed % TIPS.length];
    const luck   = (seed % 3) + 3; // 3~5점

    document.getElementById('result-emoji').textContent   = emoji;
    document.getElementById('result-message').textContent = fortuneData.message;
    document.getElementById('result-tip').textContent     = '🍀 ' + tip;

    // 별점
    const starsEl = document.getElementById('result-stars');
    starsEl.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const s = document.createElement('span');
      s.className = 'star' + (i <= luck ? '' : ' off');
      s.textContent = '⭐';
      starsEl.appendChild(s);
    }

    // 이미 본 배너
    document.getElementById('already-notice').style.display =
      alreadyViewed ? 'block' : 'none';
  }

  // ── 화면 전환 ──────────────────────────────────────────────
  function show(name) {
    ['loading','intro','result'].forEach(n => {
      document.getElementById('screen-' + n).style.display = n === name ? 'block' : 'none';
    });
  }

  function goIntro() {
    alreadyViewed = false;
    show('intro');
  }
</script>

</body>
</html>
